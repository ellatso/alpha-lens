[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "alpha-lens"
version = "0.1.0"
description = "AI-powered alpha factor autopsy and production-readiness validation for quantitative strategies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "alpha-lens contributors" },
]
keywords = [
    "quantitative-finance",
    "backtesting",
    "factor-investing",
    "alpha-research",
    "overfitting-detection",
    "deflated-sharpe-ratio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "plotly>=5.18",
    "pydantic>=2.5",
]

[project.optional-dependencies]
hmm = ["hmmlearn>=0.3"]
data = ["yfinance>=0.2.40"]
llm = ["httpx>=0.27"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = [
    "hmmlearn>=0.3",
    "yfinance>=0.2.40",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/alpha-lens/alpha-lens"
Documentation = "https://github.com/alpha-lens/alpha-lens#readme"
Issues = "https://github.com/alpha-lens/alpha-lens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_lens"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]  # allow non-snake-case in test param names
# X is conventional for design matrices and feature arrays.
"src/alpha_lens/analysis/attribution.py" = ["N806"]
"src/alpha_lens/analysis/correlation.py" = ["N806"]
"src/alpha_lens/analysis/overfitting.py" = ["N806"]
"src/alpha_lens/analysis/regime.py" = ["N806"]

[tool.mypy]
python_version = "3.10"
strict = false  # strict introduces friction with pandas; we use selective strictness
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["plotly.*", "hmmlearn.*", "yfinance.*", "statsmodels.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src/alpha_lens"]
omit = ["*/llm/*", "*/data/providers.py"]  # network-dependent modules

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
